[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-estimation-dmri"
version = "1.0.0"
description = "Bayesian diffusivity-spectrum estimation for prostate multi-b diffusion MRI (MRM 2026)."
authors = [
    { name = "Patrick Remerscheid", email = "patrick.remerscheid@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "h5py",
    "pandas",
    "pyyaml",
    "cvxopt",
    "tqdm",
    "hydra-core",
    "wandb",
    "arviz",
    "pymc>=5.6.1",
    "nibabel>=5.2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spectra_estimation_dmri" = ["data/**/*", "output/**/*"] 
