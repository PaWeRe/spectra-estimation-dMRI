[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-estimation-dmri"
version = "1.0.0"
description = "Bayesian diffusivity-spectrum estimation for prostate multi-b diffusion MRI (MRM 2026)."
authors = [
    { name = "Patrick Remerscheid", email = "patrick.remerscheid@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # core numerics / data
    "numpy",
    "scipy",
    "pandas",
    "xarray",
    # inference
    "pymc>=5.6.1",
    "arviz",
    "scikit-learn",
    # configuration and experiment tracking
    "hydra-core",
    "omegaconf",
    "pydantic",
    "pyyaml",
    "python-dotenv",
    "wandb",
    # plotting
    "matplotlib",
    "seaborn",
    "pillow",
    # image I/O for the pixel-wise demonstration
    "pynrrd",
    # misc
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spectra_estimation_dmri" = ["data/**/*", "output/**/*"] 
